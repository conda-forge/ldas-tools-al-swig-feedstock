schema_version: 1

context:
  version: 2.6.15
  # dependency versions
  ldas_tools_cmake_version: 1.5.0
  swig_version: 3.0.7

recipe:
  name: ldas-tools-al-swig
  version: ${{ version }}

source:
  url: https://software.igwn.org/sources/source/ldas-tools-al-swig-${{ version }}.tar.gz
  sha256: 3fa9f11504e0d4a413423fca733515f35e28ffcd6ae8782f5fe13934c961ae5f

build:
  number: 0

outputs:
  - package:
      name: ldas-tools-al-swig
    build:
      noarch: generic
      script: build
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake >=3.6
        - pkg-config
        - make
        - swig >=${{ swig_version }}
      host:
        - ldas-tools-cmake >=${{ ldas_tools_cmake_version }}
    tests:
      - package_contents:
          include:
            - ldastoolsal/gpstime.i

  - package:
      name: python-ldas-tools-al
    build:
      noarch: python
      script: build-python
      files:
        - lib/python*/site-packages/
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - ${{ stdlib('c') }}
        - cmake >=3.6
        - make
        - pkg-config
        - swig >=${{ swig_version }}
      host:
        - ${{ pin_subpackage('ldas-tools-al-swig', exact=True) }}
        - ldas-tools-cmake >=${{ ldas_tools_cmake_version }}
        - python ${{ python_min }}.*
      run:
        - python >=${{ python_min }}
    tests:
      - python:
          imports:
            - LDAStools
          python_version:
            - ${{ python_min }}.*
            - "*"
    about:
      summary: Python bindings for the LDAS Tools abstraction toolkit

about:
  summary: SWIG bindings for the LDAS Tools abstraction toolkit
  homepage: https://wiki.ligo.org/Computing/LDASTools
  repository: https://git.ligo.org/ldastools/LDAS_Tools
  license: GPL-3.0-or-later
  license_file: COPYING

extra:
  recipe-maintainers:
    - duncanmmacleod
    - emaros
